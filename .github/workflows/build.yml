name: Build HeadlessHub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-arm64
            artifact: headless-hub-linux-arm64
            ext: tar.gz
          - rid: linux-x64
            artifact: headless-hub-linux-x64
            ext: tar.gz
          - rid: win-x64
            artifact: headless-hub-win-x64
            ext: zip
          - rid: osx-arm64
            artifact: headless-hub-mac-arm64
            ext: tar.gz
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build
      run: |
        dotnet publish HeadlessHub.csproj \
          --configuration Release \
          --runtime ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          --output ./publish/${{ matrix.artifact }}

    - name: Create archive
      run: |
        cd publish/${{ matrix.artifact }}
        if [ "${{ matrix.ext }}" = "zip" ]; then
          7z a ../${{ matrix.artifact }}.zip . -r
        else
          tar -czvf ../${{ matrix.artifact }}.tar.gz .
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: publish/${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      run: |
        VERSION=$(date +'%Y.%m.%d')
        gh release create "v$VERSION" \
          --title "HeadlessHub $VERSION" \
          --generate-notes \
          artifacts/**/*.tar.gz \
          artifacts/**/*.zip
